<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пипка-Буквы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: шапка со счётом слов и таймером, поле во всю ширину, полоса настройки
   и статистики для взрослых снизу */
:root{
  --ink:#090b0f; --panel:#12161c; --carbon:#191e25; --line:#262f3a;
  --fg:#d9e0e8; --dim:#78848f; --red:#e4322b; --amber:#f0b429; --green:#58d68d; --pink:#ff8fc0;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--fg); font-family:var(--sans);
  display:flex; flex-direction:column; overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 12px; gap:8px;
}
.hud{display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim)}
.hud b{display:block; font-size:17px; font-weight:600; letter-spacing:.02em; color:var(--fg); font-variant-numeric:tabular-nums}
.hud .brand{color:var(--red); font-weight:600; letter-spacing:.18em}
#field{position:relative; flex:1 1 auto; min-height:0; border:1px solid var(--line); border-radius:3px; background:#bfe6ff; overflow:hidden}
#field:fullscreen{border:0; border-radius:0}
#field:fullscreen .stick{display:none}
#cv{display:block}
#field.play{cursor:none}
.lockhint{position:absolute; top:10px; left:50%; transform:translateX(-50%); padding:5px 12px; border-radius:3px; background:rgba(10,13,18,.7); font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:#d9e0e8; pointer-events:none; white-space:nowrap}
/* Индикатор пипки — для взрослого, который подбирает чувствительность */
.stick{pointer-events:none; position:absolute; left:10px; bottom:10px; width:74px; padding:6px 6px 4px; background:rgba(10,13,18,.62); border:1px solid rgba(255,255,255,.12); border-radius:3px; font-family:var(--mono); font-size:9px; letter-spacing:.12em; color:#aab4be; text-align:center}
.stick .box{position:relative; width:60px; height:60px; margin:3px auto 4px; border:1px solid rgba(255,255,255,.15); background:
  linear-gradient(to right,transparent 49%,rgba(255,255,255,.15) 49%,rgba(255,255,255,.15) 51%,transparent 51%),
  linear-gradient(to bottom,transparent 49%,rgba(255,255,255,.15) 49%,rgba(255,255,255,.15) 51%,transparent 51%)}
.stick .dot{position:absolute; left:50%; top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; background:var(--red); box-shadow:0 0 9px rgba(228,50,43,.85)}
.stick .rate{color:var(--amber)}
/* Оверлеи */
.ov{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; text-align:center; background:rgba(5,7,12,.84); padding:20px; overflow:auto}
.ov.soft{background:rgba(5,7,12,.45)}
.ov h1{margin:0; font-family:var(--mono); font-size:clamp(22px,5.5vw,34px); font-weight:600; letter-spacing:.2em; text-transform:uppercase; text-wrap:balance}
.ov h1 span{color:var(--red)}
.ov h2{margin:0; font-family:var(--mono); font-size:clamp(18px,4.5vw,26px); font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#fff}
.ov p{margin:0; max-width:52ch; font-size:13.5px; line-height:1.65; color:#c3ccd5}
.ov p b{color:var(--pink); font-weight:600}
.ov ul{margin:0; padding:0; list-style:none; display:grid; gap:7px; font-family:var(--mono); font-size:12px; color:#c3ccd5; text-align:left}
.ov ul b{color:var(--amber); font-weight:500}
.btn{font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:#fff; background:var(--red); border:0; border-radius:3px; padding:11px 22px; cursor:pointer}
.btn:hover{background:#f2473f}
.btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.btn.big{font-size:16px; padding:16px 40px; border-radius:40px}
.ghost{background:transparent; color:var(--dim); border:1px solid var(--line)}
.ghost:hover{background:var(--carbon); color:var(--fg)}
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.bar input[type=range]{flex:1 1 150px; min-width:110px; accent-color:var(--red); height:18px}
.bar .val{color:var(--amber); font-variant-numeric:tabular-nums; min-width:62px}
.bar .tip{flex:1 1 100%; text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:11.5px; color:#5f6a75}
.bar select{font-family:var(--mono); font-size:11px; color:var(--fg); background:var(--carbon); border:1px solid var(--line); border-radius:3px; padding:6px 8px}
/* Статистика для взрослого: непрозрачная, поверх стартового экрана и паузы */
#ovStats{background:#0c0f14; justify-content:flex-start; align-items:stretch; text-align:left; gap:16px}
#ovStats .in{width:100%; max-width:860px; margin:0 auto; display:grid; gap:16px}
#ovStats .top{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
#ovStats .top h2{flex:1 1 auto}
#ovStats h3{margin:0 0 8px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
#ovStats .sum{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px}
#ovStats .sum div{background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:8px 10px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
#ovStats .sum b{display:block; margin-top:2px; text-transform:none; font-size:18px; letter-spacing:.02em; color:var(--fg); font-variant-numeric:tabular-nums}
#ovStats .sum small{display:block; text-transform:none; letter-spacing:0; color:#5f6a75}
#ovStats .abc{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px}
#ovStats .abc div{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:3px; padding:4px 6px; font-family:var(--mono); font-size:10px; line-height:1.4; color:var(--dim); font-variant-numeric:tabular-nums}
#ovStats .abc div b{display:block; font-family:var(--sans); font-size:20px; font-weight:600; color:var(--fg)}
#ovStats .abc .ok{border-left-color:var(--green)}
#ovStats .abc .so{border-left-color:var(--amber)}
#ovStats .abc .bad{border-left-color:var(--red)}
#ovStats .abc .none{opacity:.4}
#ovStats table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
#ovStats th{text-align:left; font-weight:500; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); padding:4px 8px 4px 0}
#ovStats td{padding:4px 8px 4px 0; border-bottom:1px solid #161b22; color:#c3ccd5}
#ovStats td.w{font-family:var(--sans); font-weight:600; letter-spacing:.08em; color:var(--fg)}
#ovStats .note{font-size:12px; color:#7a8590; max-width:none}
#ovStats .empty{font-size:13px; color:var(--dim)}
.tw{overflow-x:auto}
</style>
</head>
<body>
<div class="hud">
  <div class="brand" data-i18n="brand">Пипка-Буквы</div>
  <div><span data-i18n="words">Слов</span><b id="hWords">0</b></div>
  <div><span data-i18n="wordT">Это слово</span><b id="hWordT">0:00</b></div>
  <div><span data-i18n="sessT">Сегодня</span><b id="hSessT">0:00</b></div>
  <div><span data-i18n="errs">Мимо</span><b id="hErr">0</b></div>
  <div><span data-i18n="friends">Друзей</span><b id="hFriends">0</b></div>
</div>

<div id="field">
  <canvas id="cv"></canvas>
  <div class="stick" aria-hidden="true">
    <span data-i18n="nub">Пипка</span>
    <div class="box"><div class="dot" id="dot"></div></div>
    <div class="rate"><span id="rate">0</span> px/s</div>
  </div>

  <div class="lockhint" id="lockHint" data-i18n="lockHint" hidden></div>

  <div class="ov" id="ovStart">
    <h1 data-i18n-html="titleH">Пипка<span>-</span>Буквы</h1>
    <p data-i18n-html="intro"></p>
    <ul>
      <li data-i18n-html="k1"></li>
      <li data-i18n-html="k2"></li>
      <li data-i18n-html="k3"></li>
      <li data-i18n-html="k4"></li>
      <li data-i18n-html="k5"></li>
    </ul>
    <button class="btn big" id="btnStart" data-i18n="startBtn">Играть</button>
    <p style="font-size:11.5px;color:#7a8590" data-i18n="note"></p>
  </div>

  <div class="ov soft" id="ovPause" hidden>
    <h2 data-i18n="pauseH">Коровка ждёт</h2>
    <p data-i18n="pauseP"></p>
    <p id="pauseStat"></p>
    <button class="btn big" id="btnResume" data-i18n="resume">Лететь</button>
  </div>

  <div class="ov" id="ovStats" hidden>
    <div class="in">
      <div class="top">
        <h2 data-i18n="statsH">Статистика</h2>
        <button class="btn ghost" id="btnStatsReset" type="button" data-i18n="statsReset">Сбросить</button>
        <button class="btn" id="btnStatsClose" type="button" data-i18n="statsClose">Закрыть</button>
      </div>
      <div id="statsBody"></div>
    </div>
  </div>
</div>

<div class="bar">
  <label for="sens" data-i18n="sensL">Чувствительность пипки</label>
  <input type="range" id="sens" min="120" max="1600" step="20" value="560">
  <span class="val" id="sensVal">560 px/s</span>
  <label for="level" data-i18n="levelL">Слова</label>
  <select id="level">
    <option value="1" data-i18n="lv1">короткие, по порядку</option>
    <option value="2" data-i18n="lv2">короткие, вразброс</option>
    <option value="3" data-i18n="lv3">+1 лишняя буква</option>
    <option value="4" data-i18n="lv4">длиннее, +2 лишних</option>
  </select>
  <label for="balMode" data-i18n="balL">Шарики</label>
  <select id="balMode">
    <option value="letters" data-i18n="bal1">с буквами</option>
    <option value="plain" data-i18n="bal2">без букв</option>
    <option value="off" data-i18n="bal3">выключены</option>
  </select>
  <button class="btn ghost" id="btnStats" type="button" data-i18n="statsBtn">Статистика</button>
  <button class="btn ghost" id="btnVoice" type="button">Голос: вкл</button>
  <select id="voiceSel" hidden></select>
  <label for="magnet" data-i18n="magL">Магнит</label>
  <select id="magnet">
    <option value="off" data-i18n="mag0">выкл.</option>
    <option value="weak" data-i18n="mag1">слабый</option>
    <option value="mid" data-i18n="mag2">средний</option>
    <option value="strong" data-i18n="mag3">сильный</option>
  </select>
  <button class="btn ghost" id="btnMute" type="button">Звук: вкл</button>
  <button class="btn ghost" id="btnMusic" type="button">Музыка: вкл</button>
  <button class="btn ghost" id="btnFull" type="button">Экран: весь</button>
  <button class="btn ghost" id="btnLang" type="button">EN</button>
  <a class="btn ghost" href="../index.html" data-i18n="allGames" style="text-decoration:none;display:inline-block">Все игры</a>
  <span class="tip" id="tip" data-i18n="tip"></span>
</div>

<script src="words.js"></script>
<script src="voice-ru.js"></script>
<script src="voice-en.js"></script>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
var field=document.getElementById('field');
var el=function(id){return document.getElementById(id)};
var ovStart=el('ovStart'), ovPause=el('ovPause'), ovStats=el('ovStats');
var dot=el('dot'), rateOut=el('rate');

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} return null; }
var num=function(s,d){ var n=parseFloat(s); return isFinite(n)?n:d; };

/* Детский палец давит резко и до упора, а не дозирует, поэтому порог полного
   отклонения выше, чем в остальных играх: взрослый тычок здесь — едва полёт */
var sens=num(store('pipka.letters.sens'),num(store('pipka.ladybird.sens'),560));
var muted=store('pipka.mute')==='1';
var musicOn=store('pipka.letters.music')!=='0';
/* Голос по умолчанию выключен: записи в новом формате ещё никто не слышал, а
   системный голос на Linux — espeak, и с ним лучше тишина. Включается кнопкой
   «Голос», выбор запоминается */
var voiceOn=store('pipka.letters.voice')==='1';
var wantFull=store('pipka.letters.full')!=='0';
var level=Math.max(1,Math.min(4,num(store('pipka.letters.level'),1)|0));
/* Шарики от клавиш: с буквами (буква клавиши звучит, нужная подсказывает бутон), без
   букв (как в коровке — просто шарик и нота) или выключены. Буквы на шариках сбивают
   ребёнка, который ещё ищет одну букву на поле, а без шариков ладошка по клавиатуре
   просто ничего не делает — выбирает взрослый */
var balMode=store('pipka.letters.balloons');
if(balMode!=='plain'&&balMode!=='off') balMode='letters';
/* Стая — не больше восьми: дальше цепочка бабочек тянется через полэкрана и
   закрывает бутоны. Девятая не встаёт в хвост, а разгоняет стаю (см. scatter) */
var FLOCK=8;
var nFriends=Math.min(FLOCK,num(store('pipka.letters.friends'),0)|0);

/* ======================= ЯЗЫК ======================= */
var TXT={
ru:{brand:'Пипка-Буквы', titleH:'Пипка<span>-</span>Буквы',
 words:'Слов', wordT:'Это слово', sessT:'Сегодня', errs:'Мимо', friends:'Друзей', nub:'Пипка',

 lockHint:'Курсор не пойман — щёлкни по полю',

 snd:'Звук', mus:'Музыка', voice:'Голос', scr:'Экран', scrF:'весь', scrW:'окно', on:'вкл', off:'выкл'},
en:{brand:'Pipka Letters', titleH:'Pipka<span>-</span>Letters',
 words:'Words', wordT:'This word', sessT:'Today', errs:'Misses', friends:'Friends', nub:'Pipka',

 k1:'<b>pipka</b> — flight; near the right letter the ladybird is drawn to it, a little (the magnet is set below)',

 sErr:'misses', sAcc:'accuracy', sPerLetter:'per letter',

 sNeed:'needed', sGot:'landed on', sTimes:'times',

/* ======================= ПОЛЕ ======================= */
/* Высота поля в логике — 540 px, ширина берётся из окна. Скорость коровки задана
   в этих пикселях, поэтому на любом экране поле пересекается за одно и то же время */
var LH=540, LW=960, W=600, H=400, DPR=1, SC=1, OX=0, OY=0;
function resize(){
  var r=field.getBoundingClientRect();

  DPR=Math.min(1.5, window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  var old=LW;
  SC=H/LH; LW=W/SC; OX=0; OY=0;
  if(LW<720){ LW=720; SC=W/LW; OY=(H-LH*SC)/2; }
  if(Math.abs(old-LW)>0.5) rescaleX(LW/old);
  BG=bakeBg(G.scene,G.round); BGP=null; G.fade=0;
}
window.addEventListener('resize',function(){ resize(); if(G.phase!=='fly') paint(); });
document.addEventListener('fullscreenchange',function(){
  setTimeout(function(){ resize(); if(G.phase!=='fly') paint(); },60);
  /* взрослый подержал Esc и вышел из полного экрана — это и есть «стоп» */
  if(!document.fullscreenElement && G.phase==='fly' && G.wasFull) pause();
  else if(document.fullscreenElement && G.phase==='fly' && !document.pointerLockElement) lockPointer();
  G.wasFull=!!document.fullscreenElement;
});

/* Утро, день, вечер, ночь — по кругу. Ночью вместо бутонов спящие звёзды */
var SCN=[
 {sky:['#ffc9df','#ffe9cf'], far:'#a6e39a', near:'#84d474', grass:['#7acb68','#5fb552'], body:'sun', sunY:150, sunC:'#ffe27a', ray:'#ffd0a0', cloud:'#ffffff', tgt:'flower'},
 {sky:['#7ccbff','#d6f0ff'], far:'#8fdc7e', near:'#6cca5c', grass:['#62c052','#4aa840'], body:'sun', sunY:92, sunC:'#ffe04d', ray:'#ffcf3a', cloud:'#ffffff', tgt:'flower'},
 {sky:['#b98bd8','#ffb07a'], far:'#9fb86a', near:'#7fa356', grass:['#6f9a4c','#557d3b'], body:'sun', sunY:170, sunC:'#ffad5c', ray:'#ff8e6b', cloud:'#ffc4b8', tgt:'flower'},
 {sky:['#141a46','#3a3f82'], far:'#2c4a52', near:'#233d45', grass:['#1f3a3c','#15292c'], body:'moon', sunY:96, sunC:'#fff4c4', ray:'#fff4c4', cloud:null, tgt:'star'}];

function rng(seed){ var a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; var x=a; x=Math.imul(x^(x>>>15),x|1); x^=x+Math.imul(x^(x>>>7),x|61); return ((x^(x>>>14))>>>0)/4294967296; }; }

function bakeBg(si,round){
  var s=SCN[si], c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height;
  var g=c.getContext('2d'), R=rng(round*977+si*31+5), k=DPR*SC;
  g.fillStyle=s.sky[0]; g.fillRect(0,0,c.width,c.height);
  g.setTransform(k,0,0,k,DPR*OX,DPR*OY);
  var gr=g.createLinearGradient(0,0,0,LH*0.62);
  gr.addColorStop(0,s.sky[0]); gr.addColorStop(1,s.sky[1]);
  g.fillStyle=gr; g.fillRect(-10,-LH,LW+20,LH*2);

    g.fillStyle='rgba(255,255,240,'+(0.25+R()*0.6).toFixed(2)+')';
    g.beginPath(); g.arc(R()*LW,R()*LH*0.55,0.6+R()*1.3,0,7); g.fill();
  }
  var a1=R()*6, b1=R()*6, a2=R()*6, b2=R()*6, x;
  g.fillStyle=s.far; g.beginPath(); g.moveTo(-10,LH+10);
  for(x=-10;x<=LW+10;x+=8) g.lineTo(x,hillY(x,LH*0.45,24,a1,b1));
  g.lineTo(LW+10,LH+10); g.fill();

  gr.addColorStop(0,s.grass[0]); gr.addColorStop(1,s.grass[1]);
  g.fillStyle=s.near; g.beginPath(); g.moveTo(-10,LH+10);
  for(x=-10;x<=LW+10;x+=8) g.lineTo(x,hillY(x,LH*0.56,18,a2,b2));
  g.lineTo(LW+10,LH+10); g.fill();
  g.fillStyle=gr; g.beginPath(); g.moveTo(-10,LH+10);
  for(x=-10;x<=LW+10;x+=8) g.lineTo(x,hillY(x,LH*0.56,18,a2,b2)+10);
  g.lineTo(LW+10,LH+10); g.fill();
  /* травинки и мелкие цветочки — фон, не цели; мелкие и тусклые, чтобы ребёнок не путал */
  g.lineCap='round';
  for(i=0;i<90;i++){
    x=R()*LW; var y=LH*0.62+R()*LH*0.38;
    g.strokeStyle='rgba(30,80,30,'+(s.tgt==='star'?0.35:0.28)+')'; g.lineWidth=2;
    g.beginPath(); g.moveTo(x-4,y-7); g.lineTo(x,y); g.lineTo(x+4,y-8); g.moveTo(x,y); g.lineTo(x+1,y-10); g.stroke();
  }
  if(s.tgt!=='star') for(i=0;i<40;i++){
    x=R()*LW; y=LH*0.6+R()*LH*0.4;
    g.fillStyle='rgba(255,255,255,.55)'; g.beginPath(); g.arc(x,y,2.2,0,7); g.fill();
    g.fillStyle='rgba(255,220,80,.7)'; g.beginPath(); g.arc(x,y,1,0,7); g.fill();
  }
  return c;
}

var AC=null, master=null, sfx=null, mus=null, noiseBuf=null, lastS={};
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    /* общий уровень ниже, чем в остальных играх: уши ближе к динамику и меньше */
    master=AC.createGain(); master.gain.value=muted?0:0.7; master.connect(AC.destination);
    var comp=AC.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=6;
    comp.connect(master);
    sfx=AC.createGain(); sfx.gain.value=0.9; sfx.connect(comp);
    mus=AC.createGain(); mus.gain.value=musicOn?0.5:0; mus.connect(comp);
    vox=AC.createGain(); vox.gain.value=1; vox.connect(comp);
    noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*1.0),AC.sampleRate);
    var ch=noiseBuf.getChannelData(0);
    for(var i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
  }catch(e){ AC=null; }
  decodePack();
}
function at(node,val,tau){ try{ node.setTargetAtTime(val,AC.currentTime,tau); }catch(e){} }
function gate(name,gap){
  if(!AC||!sfx) return false;

  lastS[name]=n; return true;
}
function mf(m){ return 440*Math.pow(2,(m-69)/12); }
function tone(f0,f1,d,type,vol,dest,when,att){
  try{
    var o=AC.createOscillator(), g=AC.createGain(), tt=when||AC.currentTime;
    o.type=type; o.frequency.setValueAtTime(f0,tt);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,tt+d);
    g.gain.setValueAtTime(0.0001,tt);
    g.gain.linearRampToValueAtTime(vol,tt+(att||0.006));
    g.gain.exponentialRampToValueAtTime(0.0001,tt+d);
    o.connect(g); g.connect(dest||sfx); o.start(tt); o.stop(tt+d+0.02);
  }catch(e){}
}
function noise(d,ftype,f0,f1,vol,dest,when,q){
  try{
    var tt=when||AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    var f=AC.createBiquadFilter(); f.type=ftype; f.frequency.setValueAtTime(f0,tt); if(q) f.Q.value=q;
    if(f1!==f0) f.frequency.exponentialRampToValueAtTime(f1,tt+d);
    var g=AC.createGain(); g.gain.setValueAtTime(vol,tt); g.gain.exponentialRampToValueAtTime(0.0001,tt+d);
    s.connect(f); f.connect(g); g.connect(dest||sfx);
    s.start(tt, Math.random()*0.5); s.stop(tt+d+0.02);
  }catch(e){}
}
/* Колокольчик музыкальной шкатулки: основной тон и две быстро гаснущие обертоны.
   Третья взята чуть выше 3f — так он звенит металлом, а не органом */

  var f=mf(m), d=dur||1.1;
  tone(f,f,d,'sine',vol,dest,when);
  tone(f*2,f*2,d*0.45,'sine',vol*0.28,dest,when);
  tone(f*3.02,f*3.02,d*0.2,'sine',vol*0.12,dest,when);
}
var snd={
  bloom:function(m){ if(!AC) return; var n=AC.currentTime;
    bell(m,0.2,n); bell(m+12,0.05,n+0.09,null,0.5); bell(m+19,0.04,n+0.16,null,0.4); },
  ring:function(m){ if(gate('ring'+m,0.15)) bell(m,0.14,AC.currentTime,null,0.8); },
  pop:function(m){ if(!AC) return; noise(0.07,'bandpass',1800,700,0.35,null,null,1.2);
    tone(700,220,0.09,'triangle',0.12); bell(m,0.08,AC.currentTime+0.04,null,0.5); },

  giggle:function(){ if(!gate('gig',0.35)) return; var n=AC.currentTime;
    [0,1,2,3,4].forEach(function(i){ var f=880+i*90+(i%2)*220; tone(f,f*1.15,0.07,'triangle',0.08,null,n+i*0.07); }); },
  hint:function(m){ if(!AC) return; var n=AC.currentTime; bell(m,0.06,n,null,0.5); bell(m,0.05,n+0.22,null,0.5); },
  fanfare:function(star){ if(!AC) return; var n=AC.currentTime, o=star?12:0;

    for(var i=0;i<10;i++) bell(96+[0,2,4,7,9][i%5],0.02,n+1.0+i*0.06,null,0.3); },

    [79,84,91].forEach(function(m,i){ bell(m,0.07,n+i*0.1,null,0.6); }); },

/* ---------- Голос ---------- */
/* Два источника. Главный — записи из voice-<язык>.js, которые генерирует make-voice.mjs
   (Gemini TTS): они звучат одинаково на любой машине и не зависят от того, что стоит
   в системе. Запасной — синтезатор речи системы: на Linux его голоса даёт
   speech-dispatcher, и espeak-ng там звучит роботом. Нет ни того, ни другого — игра
   молчит, а кнопка «Голос» говорит взрослому почему */
var PACKS=window.PIPKA_LETTERS_VOICE||{}, VBUF={}, VDEC={}, vox=null, vSrc=[], vEnd=0, vTok=0;

function b64buf(uri){ var s=atob(uri.slice(uri.indexOf(',')+1)), u=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u.buffer; }

   на первой букве ждать декодирования уже некогда */
function decodePack(){
  var p=pack(); if(!AC||!p) return;
  Object.keys(p.clips).forEach(function(k){ var id=LANG+k; if(VBUF[id]||VDEC[id]) return;
    try{ VDEC[id]=AC.decodeAudioData(b64buf(p.clips[k].d)).then(function(b){ VBUF[id]=b; return b; },function(){ return null; }); }catch(e){} });
}
function stopClips(){ for(var i=0;i<vSrc.length;i++) try{ vSrc[i].stop(); }catch(e){} vSrc=[]; vEnd=0;
  if(AC&&mus&&musicOn){ try{ mus.gain.cancelScheduledValues(AC.currentTime); mus.gain.setTargetAtTime(0.5,AC.currentTime,0.3); }catch(e){} } }
/* длина записи — чтение по буквам ждёт, пока буква договорит */
function clipDur(key){ var b=VBUF[LANG+key]; return b?b.duration:0; }
/* keep — встать в очередь за тем, что звучит (буква, потом слово, потом похвала);
   без него новая запись обрывает старую, как и пролёт к следующей букве.
   Музыка на время голоса приглушается: колыбельная и речь в одной полосе частот */
function playClip(key,keep){
  var id=LANG+key, tok=++vTok;
  function go(b){
    if(!b||(!keep&&tok!==vTok)) return;
    if(!keep) stopClips();
    var now=AC.currentTime, t0=keep?Math.max(now,vEnd):now;
    var s=AC.createBufferSource(); s.buffer=b; s.connect(vox); s.start(t0);
    vEnd=t0+b.duration; vSrc.push(s);
    /* оборванная запись успела запланировать возврат громкости на свой конец — он
       снимается, иначе музыка возвращалась на полную посреди следующей записи */
    if(mus&&musicOn){ try{ mus.gain.cancelScheduledValues(now); mus.gain.setValueAtTime(mus.gain.value,now);
      mus.gain.setTargetAtTime(0.18,t0,0.05); mus.gain.setTargetAtTime(0.5,vEnd+0.15,0.3); }catch(e){} }
    s.onended=function(){ var i=vSrc.indexOf(s); if(i>=0) vSrc.splice(i,1); };
  }
  if(VBUF[id]) go(VBUF[id]); else if(VDEC[id]) VDEC[id].then(go);
}

/* Голосов системы для языка бывает много: speech-dispatcher отдаёт браузеру все
   модули сразу, и espeak-ng с десятками вариантов «+Annie» стоит в списке первым.
   Поэтому по умолчанию берётся лучший по грубой оценке (espeak и mbrola — в конец).
   Взрослый может выбрать голос сам, записи стоят в списке первыми; выбор
   запоминается для каждого языка. Chromium отдаёт голоса не сразу, а по
   voiceschanged, поэтому «нет» объявляется только через две секунды */
var VOX=null, VSTATE='wait', VLIST=[], VUSE='';
function vScore(v){ var n=(v.name||'')+' '+(v.voiceURI||''), sc=0;
  if(/espeak|mbrola/i.test(n)) sc-=10;
  if(/\+/.test(v.name||'')) sc-=2;
  if(/rhvoice|piper|google|microsoft|natural|neural/i.test(n)) sc+=5;
  if(v.localService) sc+=1;
  return sc; }
function pickVoice(){
  var vs=[], want=LANG==='ru'?'ru':'en', i, p=pack();
  try{ if(window.speechSynthesis) vs=speechSynthesis.getVoices()||[]; }catch(e){ vs=[]; }
  VLIST=[]; for(i=0;i<vs.length;i++) if((vs[i].lang||'').toLowerCase().indexOf(want)===0) VLIST.push(vs[i]);
  VLIST.sort(function(a,b){ return vScore(b)-vScore(a) || (a.name<b.name?-1:1); });
  var saved=store('pipka.letters.voice.'+LANG);
  /* системный голос, выбранный, когда записей ещё не было, — это не отказ от записей:
     раньше он так и оставался, и после генерации игра продолжала говорить espeak'ом */
  if(p && saved && saved!=='__pack' && store('pipka.letters.voice.'+LANG+'.seen')!=='1') saved=null;
  VOX=VLIST[0]||null;
  for(i=0;i<VLIST.length;i++) if(VLIST[i].name===saved){ VOX=VLIST[i]; break; }
  VUSE=p&&(!saved||saved==='__pack'||!VOX||VOX.name!==saved)?'pack':VOX?'tts':'';
  if(VUSE) VSTATE='ok'; else if(vs.length) VSTATE='nolang'; else if(VSTATE!=='wait') VSTATE='none';
  var sel=el('voiceSel');
  if(sel){
    sel.innerHTML='';
    var add=function(v,label){ var o=document.createElement('option'); o.value=v; o.textContent=label; sel.appendChild(o); };
    if(p) add('__pack',t('vPack')+' · '+(p.meta&&p.meta.voice||'?'));
    for(i=0;i<VLIST.length;i++) add(VLIST[i].name,VLIST[i].name);
    sel.value=VUSE==='pack'?'__pack':VOX?VOX.name:'';
    sel.hidden=sel.options.length<2;
  }
  decodePack();
  if(typeof drawButtons==='function' && vb) drawButtons();
}
if(window.speechSynthesis){ try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
pickVoice();
setTimeout(function(){ if(VSTATE==='wait') VSTATE='none'; pickVoice(); },2000);

/* Буква — запись l:, слово — w:. Когда играют записи, системный голос не
   подмешивается никогда: записи нет — молчим. Раньше пропущенная запись уходила в
   синтезатор системы, и шарик с Ь от удара ладошкой говорил espeak'ом посреди
   нормального голоса. Возвращает длину записи в секундах (0 — неизвестна) */
var sayT=0;
function say(text,rate,keep){
  if(!voiceOn||muted||!text) return 0;
  var p=VUSE==='pack'&&pack(), key=(text.length===1?'l:':'w:')+text;
  if(p){ if(p.clips[key]&&AC){ playClip(key,keep); return clipDur(key); } return 0; }
  sayTTS((DICT[LANG]&&DICT[LANG].letters&&text.length===1&&DICT[LANG].letters[text])||text,rate,keep);
  return 0;
}
function sayPraise(){
  if(!voiceOn||muted) return 0;
  var p=VUSE==='pack'&&pack(), d=DICT[LANG]||{}, n=(d.praise||[]).length;
  if(!n) return 0;
  var i=Math.floor(Math.random()*n);
  if(p){ if(p.clips['p:'+i]&&AC){ playClip('p:'+i,true); return clipDur('p:'+i); } return 0; }
  sayTTS(d.praise[i],0.9,true);
  return 0;
}
/* speak сразу после cancel Chromium иногда проглатывает: очередь ещё не очищена.
   Поэтому, если что-то звучало, новая фраза уходит через 60 мс. resume — на случай
   застрявшей в паузе очереди, которая бывает в Chromium после смены вкладки */
function sayTTS(text,rate,keep){
  if(!window.speechSynthesis||!VOX) return;
  try{
    var busy=speechSynthesis.speaking||speechSynthesis.pending;
    if(!keep && busy) speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text.toLowerCase());
    u.lang=LANG==='ru'?'ru-RU':'en-US'; u.voice=VOX;
    u.rate=rate||0.8; u.pitch=1.15; u.volume=0.9;
    clearTimeout(sayT);
    var go=function(){ try{ speechSynthesis.resume(); speechSynthesis.speak(u); }catch(e){} };
    if(!keep && busy) sayT=setTimeout(go,60); else go();
  }catch(e){}
}

/* ---------- Колыбельная ---------- */
/* Генерируется, а не хранится: аккорды I–vi–IV–V, мелодия — случайное блуждание по
   мажорной пентатонике. В пентатонике нет полутонов, поэтому ни одна случайная нота
   не диссонирует резко; сильные доли всё равно притянуты к звукам аккорда */
var CHORDS=[{r:[48,52,55],pc:[0,4,7]},{r:[45,48,52],pc:[9,0,4]},{r:[41,45,48],pc:[9,0,5]},{r:[43,47,50],pc:[7,2,11]}];
var POOL=[67,69,72,74,76,79,81];
var song=null, mStep=0, mNext=0, SPB=60/76/2;
function makeSong(seed){
  var R=rng(seed*7919+13), mel=new Array(32), idx=2+Math.floor(R()*3), prev=-1, i;
  for(i=0;i<32;i++) mel[i]=0;
  /* мотив на два такта; на сильную долю — ближайший звук аккорда, но не тот же,
     что только что звучал: иначе притяжение к аккорду залипает на одной ноте */
  for(var st=0;st<16;st+=2){
    var mv=[-2,-1,-1,1,1,2][Math.floor(R()*6)];
    idx=Math.max(0,Math.min(POOL.length-1,idx+mv));
    if(st%8===0){
      var pc=CHORDS[Math.floor(st/8)].pc, bestI=idx, bd=99;
      for(i=0;i<POOL.length;i++) if(pc.indexOf(POOL[i]%12)>=0 && i!==prev && Math.abs(i-idx)<bd){ bd=Math.abs(i-idx); bestI=i; }
      idx=bestI;
    }
    if(idx===prev && R()<0.7) idx=Math.max(0,Math.min(POOL.length-1,idx+(R()<0.5?-1:1)));
    if(st%4===0 || R()<0.75){ mel[st]=POOL[idx]; prev=idx; }
    if(st%4===2 && R()<0.3) mel[st+1]=POOL[Math.max(0,Math.min(POOL.length-1,idx+(R()<0.5?-1:1)))];
  }
  for(i=0;i<16;i++) mel[16+i]=mel[i];
  /* над IV в пентатонике нет фа, поэтому третий такт проверяется отдельно:
     ре, ми и соль там ложатся секундой против фа и до */
  for(i=16;i<24;i++){ var p=mel[i]%12; if(mel[i]&&[9,0].indexOf(p)<0) mel[i]=(p===2||p===4)?72:69; }
  /* последний такт — над доминантой, полукаденция; разрешение в тонику на повторе */
  for(i=24;i<32;i++) mel[i]=0;
  mel[24]=(R()<0.5)?74:79; mel[26]=76; mel[28]=74; mel[30]=(R()<0.5)?67:79;
  return {mel:mel};
}
function musicTick(){
  if(!AC||!song||!musicOn) return;
  var now=AC.currentTime;
  if(mNext<now) mNext=now+0.05;
  while(mNext<now+0.25){ playStep(mStep,mNext); mStep=(mStep+1)%32; mNext+=SPB; }
}
function playStep(st,tt){
  var ch=CHORDS[Math.floor(st/8)].r;
  /* аккомпанемент — тихие восьмые треугольником: бас на сильную, дальше перебор */
  var an=[ch[0]-12,ch[2],ch[1],ch[2],ch[0],ch[2],ch[1],ch[2]][st%8];
  tone(mf(an),mf(an),SPB*1.6,'triangle',st%8===0?0.05:0.025,mus,tt,0.01);
  if(song.mel[st]) bell(song.mel[st],0.06,tt,mus,1.2);
}

var stick={x:0,y:0,rate:0};
var accX=0, accY=0, keys={}, botStick=null;
document.addEventListener('mousemove',function(e){
  if(G.phase!=='fly') return;
  accX+=e.movementX||0; accY+=e.movementY||0;
},{passive:true});

  if(!document.pointerLockElement) lockPointer();
  if(e.button===0||e.button===2){ giggle(); }

});

/* Раскладка ЙЦУКЕН/QWERTY по физическим кодам: шарик вылетает над той клавишей,
   по которой стукнули, и одна и та же клавиша всегда звучит одной нотой */
var ROWS=['Backquote Digit1 Digit2 Digit3 Digit4 Digit5 Digit6 Digit7 Digit8 Digit9 Digit0 Minus Equal',
  'KeyQ KeyW KeyE KeyR KeyT KeyY KeyU KeyI KeyO KeyP BracketLeft BracketRight',
  'KeyA KeyS KeyD KeyF KeyG KeyH KeyJ KeyK KeyL Semicolon Quote',
  'KeyZ KeyX KeyC KeyV KeyB KeyN KeyM Comma Period Slash'].map(function(s){return s.split(' ');});
var KNOTES=[60,62,64,67,69,72,74,76,79,81,84,86,88];
/* Буква на шарике берётся по физической клавише и языку игры, а не по e.key: у ребёнка
   раскладка могла остаться английской, а слово на экране — русское */
var KCH={ru:['','ЙЦУКЕНГШЩЗХЪ','ФЫВАПРОЛДЖЭ','ЯЧСМИТЬБЮ'], en:['','QWERTYUIOP','ASDFGHJKL','ZXCVBNM']};
function keyPlace(code){
  for(var r=0;r<ROWS.length;r++){ var i=ROWS[r].indexOf(code);
    if(i>=0) return {fx:(i+0.5+r*0.4)/13.6, note:KNOTES[Math.min(12,i)]+(r>=2?-12:0), ch:(KCH[LANG]||KCH.ru)[r][i]||''}; }
  var h=0; for(var j=0;j<code.length;j++) h=(h*31+code.charCodeAt(j))>>>0;
  return {fx:0.1+(h%80)/100, note:KNOTES[h%10], ch:''};
}
window.addEventListener('keydown',function(e){
  var k=e.key, c=e.code;
  if(G.phase!=='fly'){
    if(!ovStats.hidden){ if(k==='Escape') closeStats(); return; }
    if((k===' '||k==='Enter')&&G.phase!=='fly'&&!(e.target&&/^(BUTTON|SELECT|INPUT)$/.test(e.target.tagName))){
      e.preventDefault(); if(G.phase==='pause') resume(); else start(); }
    return;
  }
  /* во время игры клавиатура целиком принадлежит ребёнку: ни одна клавиша не
     прокручивает, не перезагружает и не уводит со страницы */
  e.preventDefault();
  if(!document.pointerLockElement) lockPointer();
  if(k==='ArrowLeft'){keys.l=1;return} if(k==='ArrowRight'){keys.r=1;return}
  if(k==='ArrowUp'){keys.u=1;return}   if(k==='ArrowDown'){keys.d=1;return}
  if(k==='Escape'&&!document.fullscreenElement){ pause(); return; }
  if(e.repeat) return;
  G.idle=0; balloon(keyPlace(c||k));
});
window.addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='ArrowLeft')keys.l=0; else if(k==='ArrowRight')keys.r=0;
  else if(k==='ArrowUp')keys.u=0; else if(k==='ArrowDown')keys.d=0;
});
/* τ = 120 мс — вдвое длиннее, чем в данмаку: детский нажим дёрганый, и фильтр
   превращает тычки в плавный полёт, а не в рывки */
function readStick(dt){
  var rx=accX/dt, ry=accY/dt; accX=0; accY=0;
  stick.rate=Math.round(Math.sqrt(rx*rx+ry*ry));
  var tx=Math.max(-1,Math.min(1,rx/sens)), ty=Math.max(-1,Math.min(1,ry/sens));
  if(keys.l||keys.r) tx=(keys.r?1:0)-(keys.l?1:0);
  if(keys.u||keys.d) ty=(keys.d?1:0)-(keys.u?1:0);
  if(botStick){ tx=botStick.x; ty=botStick.y; }
  var m=Math.sqrt(tx*tx+ty*ty); if(m>1){ tx/=m; ty/=m; }
  var a=1-Math.exp(-dt/0.12);
  stick.x+=(tx-stick.x)*a; stick.y+=(ty-stick.y)*a;
}

/* ======================= СОСТОЯНИЕ ======================= */
/* Скорость 280 px/s: поле шириной 960 пересекается за три с половиной секунды —
   быстро настолько, чтобы было весело, и медленно настолько, чтобы успеть отпустить */
/* Коровка — 28 px при высоте поля 540, примерно палец ребёнка на экране ноутбука */
var BUG_R=28, VMAX=280, FL_R=34, TOUCH=BUG_R+FL_R+10;
/* Магнит: радиус r, в котором бутон тянет коровку, и тяга — v·(1−d/r)+b px/s.
   «Сильный» — исходный, подобранный под бота со случайными тычками: до 190 px/s,
   две трети от VMAX. Он заметно ведёт сам, и взрослому это видно, поэтому сила
   выбирается: «средний» и «слабый» тянут слабее и ближе, «выкл.» не тянет совсем.
   Тяга всегда меньше VMAX — пролететь мимо можно при любом */
var MAGS={off:null, weak:{r:90,v:60,b:20}, mid:{r:110,v:100,b:30}, strong:{r:130,v:150,b:40}};
var magMode=store('pipka.letters.magnet'); if(!MAGS.hasOwnProperty(magMode)) magMode='strong';
/* Промах — не касание чужой буквы, а остановка на ней: по пути к нужной коровка то и
   дело пролетает над соседними, и пролёт насквозь даже на половине скорости длится
   секунду. Считать его ошибкой значило бы мерить расстановку, а не чтение. Поэтому
   промах — это скорость ниже 60 px/s полсекунды подряд внутри чужого бутона */
var MISS_V=60, MISS_T=0.5;
/* Плашки слова наверху: 58 px — крупнее бутона, буква на них читается с дивана */
var SLOT=58, SGAP=8, SLOT_Y=18;
var G={phase:'start', t:0, scene:0, round:0, cel:-1, fade:0, idle:0, wasFull:false, locked:false, lockT:0,
  word:'', pos:0, fill:[], bump:[], wt:0, lt:0, err:0, sess:0, words:0, rd:-1, rk:0, rnext:0};
var bug={x:480,y:300,vx:0,vy:0,open:0,flap:0,blink:0,face:1,laugh:0};
var targets=[], balloons=[], parts=[], friends=[], leaving=[], clouds=[], flies=[], hops=[];
var PCAP=450, playAcc=0;

function rescaleX(f){
  var i, all=[targets,balloons,friends,leaving,clouds,flies,hops];
  bug.x*=f;
  for(var a=0;a<all.length;a++) for(i=0;i<all[a].length;i++) all[a][i].x*=f;
}
/* ноты по месту в слове: собранное по порядку слово играет восходящую пентатонику */
var SCALE=[0,2,4,7,9,12,14];
function noteFor(i){ return (SCN[G.scene].tgt==='star'?72:60)+SCALE[Math.min(6,i)]; }
function needed(){ return G.word.charAt(G.pos); }
function isNext(f){ return !f.open && G.pos<G.word.length && f.ch===needed(); }
function slotX(i){ var n=G.word.length; return LW/2-(n*SLOT+(n-1)*SGAP)/2+i*(SLOT+SGAP)+SLOT/2; }
function makeTargets(){
  var s=SCN[G.scene], R=rng(Math.floor(Math.random()*4294967296));
  var lv=LV[level], abc=ABC[LANG]||ABC.ru, lets=G.word.split(''), i;
  /* лишние буквы — только те, которых в слове нет: иначе «лишняя» М в МАМА была бы правильной */
  for(i=0;i<lv.extra;i++){ var pool=abc.split('').filter(function(c){ return lets.indexOf(c)<0; });
    lets.push(pool[Math.floor(R()*pool.length)]); }
  var n=lets.length, pts=[], md=150, tries=0;
  /* ночью звёзды висят в небе, но ниже плашек слова */
  var y0=s.tgt==='star'?SLOT_Y+SLOT+70:LH*0.58, y1=s.tgt==='star'?LH*0.6:LH-82;
  while(pts.length<n && tries<6000){
    tries++; if(tries%600===0) md*=0.85;
    var x=70+R()*(LW-140), y=y0+R()*(y1-y0), ok=true;
    if(s.body&&Math.hypot(x-(LW-110),y-s.sunY)<120) ok=false;
    if(Math.hypot(x-bug.x,y-bug.y)<140) ok=false;
    if(x<150&&y>LH-160) ok=false;            // угол индикатора пипки
    for(var j=0;j<pts.length&&ok;j++) if(Math.hypot(x-pts[j].x,y-pts[j].y)<md) ok=false;
    if(ok) pts.push({x:x,y:y});
  }
  /* на первом уровне буквы стоят слева направо, как читаются: полёт по слову — это и
     есть чтение. Дальше расстановка случайная, и порядок держит только слово наверху */
  if(lv.order) pts.sort(function(a,b){return a.x-b.x;});
  else for(i=pts.length-1;i>0;i--){ var k=Math.floor(R()*(i+1)), tmp=pts[i]; pts[i]=pts[k]; pts[k]=tmp; }
  targets=pts.map(function(p,i){
    return {x:p.x,y:p.y,kind:s.tgt,col:PAL[Math.floor(R()*PAL.length)],ch:lets[i],note:i<G.word.length?noteFor(i):noteFor(Math.floor(R()*5)),
      open:false,b:0,bt:0,ph:R()*6,spin:R()*6,pet:5+Math.floor(R()*3),bounce:0,inside:false,blink:0,wig:0,dwell:0,missed:false};
  });
  clouds=[]; if(s.cloud) for(var c=0;c<4;c++) clouds.push({x:R()*LW,y:110+R()*70,s:0.7+R()*0.6,v:6+R()*8});
  flies=[]; if(s.tgt==='star') for(var f=0;f<14;f++) flies.push({x:R()*LW,y:LH*0.55+R()*LH*0.4,ph:R()*6,v:0.5+R()*0.8});
  song=makeSong(G.round*4+G.scene+G.words); mStep=0;
}
function newWord(){
  G.word=pickWord(); G.pos=0; G.wt=0; G.lt=0; G.err=0; G.fill=[]; G.bump=[]; G.rd=-1; hops=[];
  makeTargets();
  if(G.phase==='fly') setTimeout(function(){ say(G.word,0.7); },700);
}
/* Девятая бабочка разгоняет стаю: все восемь разлетаются от коровки веером, каждая
   в свою сторону, и улетают за край, а новенькая остаётся одна. Награда за сад
   остаётся наградой — прилёт есть всегда, — а стая не растёт без конца */
function scatter(){
  for(var i=0;i<friends.length;i++){ var f=friends[i];
    var a=Math.atan2(f.y-bug.y,f.x-bug.x)+(Math.random()-0.5)*1.2, v=110+Math.random()*90;
    leaving.push({x:f.x,y:f.y,col:f.col,ph:f.ph,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,t:0});
    burst(f.x,f.y,6,[f.col,'#ffffff'],'spark',80);
  }
  friends=[]; snd.whoosh();
}
function mkFriend(x,y){ return {x:x,y:y,col:PAL[(friends.length*3+1)%PAL.length],ph:Math.random()*6}; }
function reset(){
  bug.x=LW/2; bug.y=LH*0.42; bug.vx=bug.vy=0; bug.open=0;
  G.cel=-1; G.idle=0; G.fade=0; balloons=[]; parts=[]; leaving=[];
  friends=[]; for(var i=0;i<nFriends;i++) friends.push(mkFriend(bug.x-40-i*30,bug.y+10));
  newWord();
}
function flushPlay(){ if(playAcc>0){ stats().play+=playAcc; dayRec().play+=playAcc; playAcc=0; } }
/* ======================= ЧАСТИЦЫ ======================= */
function burst(x,y,n,cols,kind,spd){
  for(var i=0;i<n&&parts.length<PCAP;i++){
    var a=Math.random()*Math.PI*2, v=(spd||120)*(0.4+Math.random()*0.8);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,life:0,max:0.8+Math.random()*0.7,
      col:cols[Math.floor(Math.random()*cols.length)],s:3+Math.random()*4,kind:kind||'spark',rot:Math.random()*6,vr:(Math.random()-0.5)*6});
  }
}


/* ======================= ДЕЙСТВИЯ ======================= */
function balloon(p){
  if(balMode==='off'||balloons.length>=12) return;
  if(balMode==='plain') p={fx:p.fx,note:p.note,ch:''};
  var col=PAL[Math.floor(p.fx*PAL.length*2.7)%PAL.length];
  balloons.push({x:30+p.fx*(LW-60),y:LH+40,vy:-(48+Math.random()*20),col:col,ph:Math.random()*6,note:p.note,born:G.t,ch:p.ch||''});
  snd.balloon(p.note);
  if(!p.ch) return;
  /* ладошкой по клавишам — каждая буква звучит; совпала с нужной — её бутон машет */
  if(gate('sayKey',0.3)||!AC) say(p.ch,1);
  if(p.ch===needed() && G.rd<0) for(var i=0;i<targets.length;i++) if(isNext(targets[i])){ targets[i].wig=1; break; }
}
function giggle(){
  G.idle=0; bug.laugh=0.8;
  for(var i=0;i<4&&parts.length<PCAP;i++)
    parts.push({x:bug.x+(Math.random()-0.5)*30,y:bug.y-30,vx:(Math.random()-0.5)*40,vy:-60-Math.random()*40,life:0,max:1.3,col:'#ff5c8a',s:9+Math.random()*5,kind:'heart',rot:0,vr:0});
  snd.giggle();
  if(gate('sayWord',2)) setTimeout(function(){ say(G.word,0.7); },450);
  for(var j=0;j<G.word.length;j++) G.bump[j]=1;
  var n=0;
  for(j=0;j<targets.length;j++) if(targets[j].open){
    targets[j].bounce=1;
    if(AC) bell(targets[j].note,0.05,AC.currentTime+0.25+n*0.09,null,0.6);
    n++;
  }
}
/* Нужная буква: бутон распускается, буква улетает на своё место в слове. Нота
   назначается по месту, а не по бутону: в МАМА обе М одинаковы, и какую ни возьми
   первой, слово сыграет одну и ту же гамму */
function collect(f){
  var i=G.pos;
  f.open=true; f.bt=0; f.bounce=1; f.note=noteFor(i);
  snd.bloom(f.note);
  burst(f.x,f.y,22,f.kind==='star'?['#fff6b0','#ffe066','#ffffff']:[f.col,'#ffffff','#ffe066'],'spark',150);
  hops.push({ch:f.ch,i:i,x:f.x,y:f.y,x0:f.x,y0:f.y,t:0,col:f.kind==='star'?'#ffd23a':f.col,note:f.note});
  var r=letterRec(f.ch); r.n++; r.t+=G.lt; G.lt=0;
  say(f.ch,0.9);
  G.pos++; G.idle=0;
  if(G.pos>=G.word.length) finishWord();
}
function miss(f){
  var want=needed(), s=stats();
  f.wig=1; snd.no();
  G.err++; s.err++; dayRec().err++;
  letterRec(want).err++;
  s.conf[want+f.ch]=(s.conf[want+f.ch]||0)+1;
  /* через полторы секунды нужная буква сама машет и называется */
  G.idle=Math.max(G.idle,4.5);
}
/* Слово собрано. Сначала последняя буква долетает (0.9 с), потом слово читается
   по буквам, по 0.5 с на каждую, потом целиком — и только после этого фанфара */
function finishWord(){
  var s=stats(), d=dayRec(), n=G.word.length;
  s.words++; s.time+=G.wt; if(!s.best||G.wt<s.best) s.best=G.wt; d.words++;
  s.recent.push({w:G.word,t:Math.round(G.wt*10)/10,e:G.err,l:level,d:Date.now()});
  if(s.recent.length>200) s.recent.shift();
  G.words++; flushPlay(); saveStats();
  G.rd=0; G.rk=0; G.rnext=G.t+0.9;
}

/* ======================= ШАГ ======================= */
function step(dt){
  G.t+=dt;
  var celebrating=G.rd>=0||G.cel>-1;
  /* таймер слова идёт только в полёте и до последней буквы */
  G.sess+=dt; playAcc+=dt;
  if(!celebrating){ G.wt+=dt; G.lt+=dt; }
  /* --- полёт --- */
  var tvx=stick.x*VMAX, tvy=stick.y*VMAX;
  var sm=Math.sqrt(stick.x*stick.x+stick.y*stick.y);
  if(sm>0.08) G.idle=0; else G.idle+=dt;
  /* Тянет только нужная буква, чужие — нет: иначе коровку затягивало бы в соседний
     бутон, и промах делала бы игра, а не ребёнок. Тяга слабее полного отклонения почти
     вдвое, поэтому пролететь мимо можно всегда, а остановиться рядом — значит долететь */
  /* Две последние буквы слова тянут в полтора раза дальше, как два последних бутона
     в коровке: случайные тычки до них долетают хуже всего */
  var near=null, nd=1e9, i, f, left=G.word.length-G.pos;
  for(i=0;i<targets.length;i++){ f=targets[i]; if(!isNext(f)) continue;
    var d=Math.hypot(f.x-bug.x,f.y-bug.y); if(d<nd){ nd=d; near=f; } }
  var M=MAGS[magMode], mag=M?(left<=2?M.r*1.5:M.r):0;
  if(M && near && nd<mag && nd>1){
    var pull=M.v*(1-nd/mag)+M.b;
    tvx+=(near.x-bug.x)/nd*pull; tvy+=(near.y-bug.y)/nd*pull;
  }
  var a=1-Math.exp(-dt/0.25);
  bug.vx+=(tvx-bug.vx)*a; bug.vy+=(tvy-bug.vy)*a;
  bug.x+=bug.vx*dt; bug.y+=bug.vy*dt;
  /* края мягкие: коровка не улетает за экран, а отскакивает, как от стекла */
  var mx=BUG_R+6, top=BUG_R+30, bot=LH-BUG_R-6;
  if(bug.x<mx){ bug.x=mx; bug.vx=Math.abs(bug.vx)*0.4; }
  if(bug.x>LW-mx){ bug.x=LW-mx; bug.vx=-Math.abs(bug.vx)*0.4; }
  if(bug.y<top){ bug.y=top; bug.vy=Math.abs(bug.vy)*0.4; }
  if(bug.y>bot){ bug.y=bot; bug.vy=-Math.abs(bug.vy)*0.4; }
  var sp=Math.hypot(bug.vx,bug.vy);
  var flying=sp>14||sm>0.08;
  bug.open+=((flying?1:0)-bug.open)*(1-Math.exp(-dt/0.12));
  bug.flap+=dt*(18+sp*0.06);
  if(sp>4) bug.face=bug.vx<0?-1:1;
  bug.blink-=dt; if(bug.blink<-3.2-Math.random()*2) bug.blink=0.14;
  bug.laugh=Math.max(0,bug.laugh-dt);
  if(sp>60 && Math.random()<dt*14 && parts.length<PCAP)
    parts.push({x:bug.x-bug.vx*0.06,y:bug.y-bug.vy*0.06+6,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,life:0,max:0.6,col:'#fff7c0',s:2+Math.random()*2,kind:'spark',rot:0,vr:0});

  /* --- цели --- */
  for(i=0;i<targets.length;i++){ f=targets[i];
    var dd=Math.hypot(f.x-bug.x,f.y-bug.y), inside=dd<TOUCH;
    if(inside && !f.inside){ if(isNext(f)) collect(f); else if(f.open){ snd.ring(f.note); f.bounce=1; } }
    if(inside && !f.open && !celebrating && !isNext(f)){
      if(sp<MISS_V) f.dwell+=dt; else f.dwell=0;
      if(f.dwell>=MISS_T && !f.missed){ f.missed=true; miss(f); }
    } else if(!inside){ f.dwell=0; f.missed=false; }
    f.inside=inside;
    if(f.open) f.bt=Math.min(1,f.bt+dt/0.7);
    f.bounce=Math.max(0,f.bounce-dt*1.6); f.wig=Math.max(0,f.wig-dt*0.9);
    f.spin+=dt*(f.open?0.35:0); f.blink-=dt; if(f.blink<-2.5-((f.ph*7)%3)) f.blink=0.15;
  }
  /* подсказка: если пипку не трогают шесть секунд, нужная буква машет, звенит и
     называется; плашка в слове подпрыгивает — видно, что ищем именно её */
  if(!celebrating && G.idle>6){
    G.idle=2.5; var h=null, hd=1e9;
    for(i=0;i<targets.length;i++) if(isNext(targets[i])){ var q=Math.hypot(targets[i].x-bug.x,targets[i].y-bug.y); if(q<hd){hd=q;h=targets[i];} }
    if(h){ h.wig=1; snd.hint(h.note); say(h.ch,0.8); G.bump[G.pos]=1; }
  }
  /* --- буквы в полёте к слову --- */
  for(i=hops.length-1;i>=0;i--){ var hp=hops[i]; hp.t+=dt/0.9;
    var e=hp.t>=1?1:1-Math.pow(1-hp.t,3), tx0=slotX(hp.i), ty0=SLOT_Y+SLOT/2;
    hp.x=hp.x0+(tx0-hp.x0)*e; hp.y=hp.y0+(ty0-hp.y0)*e-Math.sin(e*Math.PI)*40;
    if(hp.t>=1){ G.fill[hp.i]=hp.col; G.bump[hp.i]=1; snd.land(hp.note);
      burst(tx0,ty0,10,[hp.col,'#ffffff'],'spark',90); hops.splice(i,1); }
  }
  for(i=0;i<G.word.length;i++) if(G.bump[i]) G.bump[i]=Math.max(0,G.bump[i]-dt*2.2);
  /* --- чтение собранного слова: по буквам, потом целиком --- */
  /* Следующая буква — не раньше, чем через 0.5 с и не раньше, чем договорит
     предыдущая: раньше шаг был ровно 0.5 с, и запись «а» в 1.4 с обрывалась на трети */
  if(G.rd>=0){
    var n=G.word.length; G.rd+=dt;
    if(G.t>=G.rnext){
      if(G.rk<n){ var k=G.rk; G.bump[k]=1; if(AC) bell(noteFor(k),0.1,AC.currentTime,null,0.7);
        G.rnext=G.t+Math.max(0.5,say(G.word[k],1)+0.12); }
      else if(G.rk===n){ for(i=0;i<n;i++) G.bump[i]=1;
        var dw=say(G.word,0.7), dp=sayPraise();
        G.rnext=G.t+Math.max(0.9,dw+dp+0.3); }
      else { G.rd=-1; G.cel=-0.6; }
      G.rk++;
    }
  }
  /* --- шарики --- */
  for(i=balloons.length-1;i>=0;i--){ var b=balloons[i];
    b.y+=b.vy*dt; b.x+=Math.sin(G.t*1.4+b.ph)*12*dt;
    if(Math.hypot(b.x-bug.x,b.y-bug.y)<BUG_R+26){
      snd.pop(b.note); burst(b.x,b.y,18,[b.col,'#ffffff'],'conf',170);
      balloons.splice(i,1); continue;
    }
    if(b.y<-90) balloons.splice(i,1);
  }
  /* --- разлетающаяся стая: разгон, пока не скроются за краем --- */
  for(i=leaving.length-1;i>=0;i--){ var lv=leaving[i]; lv.t+=dt;
    lv.vx*=1+dt*0.9; lv.vy*=1+dt*0.9; lv.x+=lv.vx*dt; lv.y+=lv.vy*dt+Math.sin(G.t*9+lv.ph)*20*dt;
    if(lv.t>6||lv.x<-80||lv.x>LW+80||lv.y<-80||lv.y>LH+80) leaving.splice(i,1); }
  /* --- друзья: каждая бабочка следует за предыдущей, первая — за коровкой --- */
  for(i=0;i<friends.length;i++){ var fr=friends[i], lead=i?friends[i-1]:bug;
    var tx=lead.x-(i?0:bug.face*34)+Math.sin(G.t*1.7+fr.ph)*14, ty=lead.y+12+Math.cos(G.t*2.1+fr.ph)*10;
    var dx=tx-fr.x, dy=ty-fr.y, dl=Math.hypot(dx,dy), keep=i?30:0;
    if(dl>keep){ var k=(1-Math.exp(-dt/0.32)); fr.x+=dx*(1-keep/dl)*k; fr.y+=dy*(1-keep/dl)*k; }
  }
  /* --- праздник --- */
  /* праздник идёт по своему таймеру, а не по celebrating: тот включается уже на время
     чтения слова, и G.cel успевал дотикать от −1 до фанфары, пока слово читалось, —
     после чтения праздник начинался второй раз, со второй бабочкой */
  if(G.cel>-1){
    var pc=G.cel; G.cel+=dt;
    if(pc<0&&G.cel>=0){ snd.fanfare(SCN[G.scene].tgt==='star');
      /* лишние буквы тоже распускаются: на празднике закрытых бутонов не остаётся */
      for(i=0;i<targets.length;i++){ if(!targets[i].open){ targets[i].open=true; targets[i].bt=0; }
        burst(targets[i].x,targets[i].y,14,PAL,'conf',200); } }
    if(pc<1.4&&G.cel>=1.4){
      if(friends.length>=FLOCK) scatter();
      var side=bug.x<LW/2?LW+30:-30; friends.push(mkFriend(side,bug.y-60));
      nFriends=friends.length; store('pipka.letters.friends',nFriends); snd.friend();
    }
    if(G.cel>0 && G.cel<4.5 && Math.random()<dt*10)
      burst(Math.random()*LW,-10,1,PAL,'conf',40);
    if(G.cel>=6.2) nextScene();
  }
  if(G.fade>0) G.fade=Math.max(0,G.fade-dt/1.4);
  for(i=0;i<clouds.length;i++){ var cl=clouds[i]; cl.x+=cl.v*dt; if(cl.x>LW+120) cl.x=-120; }
  for(i=0;i<flies.length;i++){ var fl=flies[i]; fl.x+=Math.sin(G.t*fl.v+fl.ph)*18*dt; fl.y+=Math.cos(G.t*fl.v*0.8+fl.ph*2)*12*dt; }
  /* --- частицы --- */
  for(i=parts.length-1;i>=0;i--){ var p=parts[i]; p.life+=dt;
    if(p.life>=p.max){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    if(p.kind==='conf'){ p.vy+=90*dt; p.vx*=1-dt*1.5; p.vy*=1-dt*0.8; }
    else if(p.kind==='heart'){ p.vy-=10*dt; }
    else { p.vx*=1-dt*3; p.vy*=1-dt*3; }
  }
}
function nextScene(){
  BGP=BG; G.fade=1; G.cel=-1;
  G.scene=(G.scene+1)%SCN.length; if(G.scene===0) G.round++;
  BG=bakeBg(G.scene,G.round);
  newWord(); snd.whoosh();
}

/* ======================= РИСОВАНИЕ ======================= */
function easeBack(x){ var c1=1.70158, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }
function circ(x,y,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function starPath(x,y,r,rot,inner){
  ctx.beginPath();
  for(var i=0;i<10;i++){ var a=rot+i*Math.PI/5-Math.PI/2, rr=i%2?r*(inner||0.5):r;
    if(i) ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); else ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); }
  ctx.closePath();
}
function heartPath(x,y,s){
  ctx.beginPath(); ctx.moveTo(x,y+s*0.35);
  ctx.bezierCurveTo(x-s*0.7,y-s*0.1,x-s*0.35,y-s*0.65,x,y-s*0.25);
  ctx.bezierCurveTo(x+s*0.35,y-s*0.65,x+s*0.7,y-s*0.1,x,y+s*0.35);
  ctx.fill();
}
/* Мордочка: глаза смотрят на коровку — так ребёнок видит, что его заметили */
function face(x,y,r,open,smile,look){
  var lx=0, ly=0;
  if(look){ var dx=bug.x-x, dy=bug.y-y, d=Math.hypot(dx,dy)||1; lx=dx/d*r*0.08; ly=dy/d*r*0.08; }
  ctx.fillStyle='#3a2a2a'; ctx.strokeStyle='#3a2a2a'; ctx.lineCap='round'; ctx.lineWidth=Math.max(1.5,r*0.09);
  for(var s=-1;s<=1;s+=2){
    var ex=x+s*r*0.36, ey=y-r*0.12;
    if(open){ ctx.beginPath(); ctx.arc(ex+lx,ey+ly,r*0.13,0,Math.PI*2); ctx.fill();
      circ(ex+lx+r*0.04,ey+ly-r*0.05,r*0.045,'#fff'); ctx.fillStyle='#3a2a2a'; }
    else { ctx.beginPath(); ctx.arc(ex,ey-r*0.03,r*0.12,0.15*Math.PI,0.85*Math.PI); ctx.stroke(); }
  }
  dots([x-r*0.6,y+r*0.18,r*0.14, x+r*0.6,y+r*0.18,r*0.14],'rgba(255,120,150,.45)');
  ctx.beginPath();
  if(smile>1){ ctx.fillStyle='#7a2a3a'; ctx.arc(x,y+r*0.14,r*0.24,0,Math.PI); ctx.fill(); }
  else { ctx.arc(x,y+r*0.08,r*0.26,0.18*Math.PI,0.82*Math.PI); ctx.stroke(); }
}
function drawSky(){
  var s=SCN[G.scene], x=LW-110, y=s.sunY, r=s.body==='sun'?44:40, i;
  var happy=G.cel>=0;
  if(s.body==='sun'){
    ctx.save(); ctx.translate(x,y); ctx.rotate(G.t*0.15); ctx.fillStyle=s.ray;
    for(i=0;i<12;i++){ ctx.rotate(Math.PI/6); ctx.beginPath(); ctx.moveTo(-7,-r-4); ctx.lineTo(0,-r-20-(i%2)*8); ctx.lineTo(7,-r-4); ctx.fill(); }
    ctx.restore();
    circ(x,y,r,s.sunC);
    face(x,y,r,true,happy?2:1,true);
  } else {
    var gr=ctx.createRadialGradient(x,y,r*0.6,x,y,r*2.2);
    gr.addColorStop(0,'rgba(255,245,200,.35)'); gr.addColorStop(1,'rgba(255,245,200,0)');
    ctx.fillStyle=gr; ctx.fillRect(x-r*2.3,y-r*2.3,r*4.6,r*4.6);
    circ(x,y,r,s.sunC);
    dots([x-14,y+16,6, x+18,y-20,4, x+22,y+10,3],'rgba(220,210,160,.3)');
    /* луна спит, пока не зажжены все звёзды */
    face(x,y,r,happy,happy?2:1,happy);
  }
  if(s.cloud) for(i=0;i<clouds.length;i++){ var c=clouds[i], k=c.s;
    ctx.globalAlpha=0.9; dots([c.x,c.y,22*k, c.x+24*k,c.y-10*k,26*k, c.x+52*k,c.y,22*k, c.x+26*k,c.y+8*k,22*k],s.cloud); ctx.globalAlpha=1; }
}
function drawRainbow(){
  if(G.cel<0) return;
  var s=SCN[G.scene], cx=LW/2, cy=LH*0.98, R0=Math.min(LW*0.46,LH*0.86);
  var sweep=Math.min(1,G.cel/1.6), fade=G.cel>5?Math.max(0,1-(G.cel-5)/1.2):1;
  if(s.tgt==='star'){
    /* ночью вместо радуги — падающие звёзды */
    for(var j=0;j<5;j++){ var tt=(G.cel*0.6+j*0.37)%1, sx=LW*(0.15+j*0.17)+tt*160, sy=40+j*22+tt*120;
      ctx.globalAlpha=fade*(1-tt); ctx.strokeStyle='#fff8d0'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx-50,sy-36); ctx.stroke();
      ctx.fillStyle='#fff'; starPath(sx,sy,7,0,0.45); ctx.fill(); }
    ctx.globalAlpha=1; return;
  }
  var cols=['#ff5a5a','#ffa23a','#ffe14d','#6fd36a','#4fb4ff','#6b6bff','#b46bff'];

var hudT=0;
function hud(dt){
  hudT+=dt; if(hudT<0.1) return; hudT=0;
  flushPlay();
  el('hWords').textContent=G.words; el('hFriends').textContent=friends.length;
  el('hWordT').textContent=fmtT(G.wt); el('hSessT').textContent=fmtT(G.sess); el('hErr').textContent=G.err;
  dot.style.transform='translate('+(stick.x*24).toFixed(1)+'px,'+(stick.y*24).toFixed(1)+'px)';
  rateOut.textContent=stick.rate;
  var fly=G.phase==='fly', unl=fly&&!document.pointerLockElement&&!botStick&&performance.now()-G.lockT>1200;
  field.classList.toggle('play',fly);
  if(el('lockHint').hidden===unl) el('lockHint').hidden=!unl;
}

/* ======================= ЦИКЛ ======================= */
var last=0, acc=0, FIX=1/120;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  var dt=Math.min(0.05,(ts-last)/1000); last=ts;
  if(dt<=0) return;
  if(G.phase==='fly'){
    readStick(dt);
    acc+=dt;
    var guard=0;
    while(acc>=FIX && guard++<12 && G.phase==='fly'){ step(FIX); acc-=FIX; }
    if(guard>=12) acc=0;
    musicTick();
    paint();
  } else if(G.phase==='start'){
    /* на заставке коровка просто живёт: моргает, облака плывут */
    G.t+=dt; bug.blink-=dt; if(bug.blink<-3) bug.blink=0.14;
    for(var i=0;i<clouds.length;i++){ clouds[i].x+=clouds[i].v*dt; if(clouds[i].x>LW+120) clouds[i].x=-120; }
    paint();
  }
  hud(dt);
}

/* ======================= ФАЗЫ ======================= */
/* Порядок важен: в Chromium requestFullscreen расходует жест пользователя, и захват
   курсора, запрошенный после него, браузер отклоняет — курсор ездил по всему экрану.
   Поэтому сначала захват, потом полный экран; если захват всё же слетел, его вернёт
   любой клик или клавиша — у ребёнка их будет предостаточно */
function lockAll(){
  G.lockT=performance.now();
  lockPointer();
  if(wantFull && field.requestFullscreen && !document.fullscreenElement){
    try{
      var pr=field.requestFullscreen({navigationUI:'hide'});
      if(pr&&pr.then) pr.then(function(){
        /* Keyboard Lock: только Chromium и только на весь экран; Esc тогда выходит
           долгим нажатием, а короткий Esc ребёнка превращается в шарик */
        if(navigator.keyboard&&navigator.keyboard.lock) navigator.keyboard.lock().catch(function(){});
        lockPointer();
      }).catch(function(){});
    }catch(e){}
  }
}
function lockPointer(){
  if(document.pointerLockElement||!cv.requestPointerLock) return;
  try{ var p=cv.requestPointerLock(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
}
function start(){
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
  G.phase='fly'; last=0; acc=0; accX=accY=0;
  ovStart.hidden=true; ovPause.hidden=true;
  lockAll();
  /* слово называется сразу, как только началась игра: иначе первое слово молчит */
  setTimeout(function(){ say(G.word,0.7); },600);
}
function pause(){
  if(G.phase!=='fly') return;
  G.phase='pause'; ovPause.hidden=false; keys={}; stopClips();
  flushPlay(); saveStats();
  el('pauseStat').textContent=t('pauseStat').replace('{w}',G.words).replace('{wn}',plural(G.words)).replace('{t}',fmtT(G.sess));
  try{ speechSynthesis.cancel(); }catch(e){}
  if(AC) try{ AC.suspend(); }catch(e){}
  if(document.exitPointerLock && document.pointerLockElement) document.exitPointerLock();
  paint();
}
function resume(){
  if(G.phase!=='pause') return;
  G.phase='fly'; ovPause.hidden=true; accX=0; accY=0; last=0; acc=0; G.idle=0;
  if(AC) try{ AC.resume(); }catch(e){}
  lockAll();
}
/* Chromium отпускает захват курсора в момент перехода на весь экран — замерено
   в безголовом прогоне: игра вставала на паузу сразу после «Играть». Поэтому пауза —
   только если захват был и прожил дольше перехода; иначе просим его ещё раз */
document.addEventListener('pointerlockchange',function(){
  if(document.pointerLockElement){ G.locked=true; return; }
  var had=G.locked; G.locked=false;
  if(G.phase!=='fly'||botStick) return;
  if(had && performance.now()-G.lockT>800) pause(); else lockPointer();
});
el('btnStart').addEventListener('click',start);
el('btnResume').addEventListener('click',function(e){ e.stopPropagation(); resume(); });
/* в паузе подойдёт любой тычок в поле — ребёнок не попадёт в кнопку, и не нужно */
field.addEventListener('mousedown',function(e){
  if(G.phase==='pause' && ovStats.hidden && e.target.tagName!=='BUTTON') resume();
});
var sl=el('sens'), sv=el('sensVal');
sl.value=sens; sv.textContent=sens+' px/s';
sl.addEventListener('input',function(){ sens=num(sl.value,560); sv.textContent=sens+' px/s'; store('pipka.letters.sens',sens); });
var mgSel=el('magnet'); mgSel.value=magMode;
mgSel.addEventListener('change',function(){
  magMode=MAGS.hasOwnProperty(mgSel.value)?mgSel.value:'strong'; store('pipka.letters.magnet',magMode); mgSel.blur();
});
var bmSel=el('balMode'); bmSel.value=balMode;
bmSel.addEventListener('change',function(){
  balMode=bmSel.value==='plain'||bmSel.value==='off'?bmSel.value:'letters';
  store('pipka.letters.balloons',balMode); bmSel.blur();
});
var lvSel=el('level'); lvSel.value=level;
lvSel.addEventListener('change',function(){
  level=Math.max(1,Math.min(4,num(lvSel.value,1)|0)); store('pipka.letters.level',level);
  /* до первой буквы слово меняется сразу, иначе — со следующего */
  if(G.pos===0 && G.rd<0 && G.cel<=-1){ recentW.pop(); newWord(); if(G.phase!=='fly') paint(); }
  lvSel.blur();
});
/* статистика открывается поверх всего; в полёте сначала пауза, чтобы таймер встал */
function openStats(){ if(G.phase==='fly') pause(); flushPlay(); renderStats(); ovStats.hidden=false; el('btnStatsClose').focus(); }
function closeStats(){ ovStats.hidden=true; }
el('btnStats').addEventListener('click',function(e){ e.currentTarget.blur(); openStats(); });
el('btnStatsClose').addEventListener('click',closeStats);
el('btnStatsReset').addEventListener('click',function(){
  if(!window.confirm(t('statsAsk'))) return;
  stats(); ST[LANG]=null; stats(); saveStats(); renderStats();
});
window.addEventListener('pagehide',function(){ flushPlay(); saveStats(); });
document.addEventListener('visibilitychange',function(){ if(document.hidden){ flushPlay(); saveStats(); } });
var mb=el('btnMute'), mub=el('btnMusic'), fb=el('btnFull'), vb=el('btnVoice');
/* выбранный голос сразу пробуется на слове, чтобы взрослый сравнивал на слух */
el('voiceSel').addEventListener('change',function(){ var sel=el('voiceSel');
  initAudio(); if(AC && AC.state==='suspended' && G.phase!=='pause') AC.resume();
  store('pipka.letters.voice.'+LANG,sel.value); store('pipka.letters.voice.'+LANG+'.seen',pack()?'1':'0');
  pickVoice(); sel.blur();
  var was=voiceOn; voiceOn=true;
  setTimeout(function(){ say(G.word||(LANG==='ru'?'МАМА':'MOM'),0.8); voiceOn=was; },VUSE==='pack'?250:0); });
vb.addEventListener('click',function(){ voiceOn=!voiceOn; store('pipka.letters.voice',voiceOn?'1':'0'); drawButtons();
  if(!voiceOn) try{ speechSynthesis.cancel(); }catch(e){} });
function drawButtons(){
  vb.textContent=t('voice')+': '+(!voiceOn?t('off'):VSTATE==='none'?t('vNone'):VSTATE==='nolang'?t('vNoLang'):t('on'));
  vb.title=VSTATE==='none'||VSTATE==='nolang'?t('vHelp'):'';
  mb.textContent=t('snd')+': '+(muted?t('off'):t('on'));
  mub.textContent=t('mus')+': '+(musicOn?t('on'):t('off'));
  fb.textContent=t('scr')+': '+(wantFull?t('scrF'):t('scrW'));
}
mb.addEventListener('click',function(){
  muted=!muted; store('pipka.mute',muted?'1':'0'); drawButtons();
  if(master) at(master.gain, muted?0:0.7, 0.05);
});
mub.addEventListener('click',function(){
  musicOn=!musicOn; store('pipka.letters.music',musicOn?'1':'0'); drawButtons();
  if(mus) at(mus.gain, musicOn?0.5:0, 0.05);
});
fb.addEventListener('click',function(){ wantFull=!wantFull; store('pipka.letters.full',wantFull?'1':'0'); drawButtons(); });
el('btnLang').addEventListener('click',function(){
  LANG=(LANG==='ru'?'en':'ru'); store('pipka.lang',LANG); pickVoice();
  /* другой язык — другой алфавит: текущее слово бросается, начинается новое */
  recentW=[]; G.cel=-1; G.rd=-1; newWord(); applyLang(); if(G.phase!=='fly') paint();
});

/* крючок для прогона ботом в безголовом браузере; в обычной игре не используется */
if(location.hash==='#test') window.__letters={G:G,bug:bug,step:step,paint:paint,start:start,pause:pause,
  isNext:isNext, pickVoice:pickVoice, say:say, sayPraise:sayPraise, voice:function(){ return {VUSE:VUSE,VSTATE:VSTATE,dec:Object.keys(VBUF).length,src:vSrc.length,ac:!!AC}; }, stats:stats, renderStats:renderStats, openStats:openStats, newWord:newWord, hops:function(){return hops;},
  targets:function(){return targets;}, balloons:function(){return balloons;}, friends:function(){return friends;}, leaving:function(){return leaving;},
  parts:function(){return parts;}, song:function(){return song;}, makeSong:makeSong, keyPlace:keyPlace, balloon:balloon, giggle:giggle,
  setBalMode:function(m){ bmSel.value=m; bmSel.dispatchEvent(new Event('change')); }, setMagnet:function(m){ mgSel.value=m; mgSel.dispatchEvent(new Event('change')); }, setStick:function(x,y){ botStick={x:x,y:y}; }, readStick:readStick, LW:function(){return LW;}, LH:LH};

function boot(saved){
  if(saved&&saved.sens){ sens=saved.sens; sl.value=sens; sv.textContent=sens+' px/s'; }
  resize(); reset(); applyLang(); paint();
  requestAnimationFrame(frame);
}
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {sens:sens}; });
    if(window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude.hot.data||{});
  } else boot({});
}catch(e){ boot({}); }
})();
</script>
</body>
</html>
